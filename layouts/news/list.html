{{ define "main" }}
<section class="page">
  <div class="site-shell">
    {{ partial "site-section-heading.html" (dict "kicker" "News" "title" .Title "text" .Params.description) }}
    <div class="content-grid content-grid--news">
      {{ range .Pages.ByDate.Reverse }}
        {{ partial "news-card.html" . }}
      {{ else }}
        <div class="empty-state">
          <p>No news items have been posted yet.</p>
        </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
