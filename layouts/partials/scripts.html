<script>

document.addEventListener('DOMContentLoaded', () => {
  const els = document.querySelectorAll('.reveal');
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('is-visible'); });
  }, { threshold: 0.15 });
  els.forEach(el => obs.observe(el));
});

  document.addEventListener("DOMContentLoaded", function() {
    // Finds only the elements where the location is explicitly left empty
    document.querySelectorAll('[data-umami-event-location=""]').forEach(function(el) {
      el.setAttribute('data-umami-event-location', window.location.pathname);
    });
  });

</script>
