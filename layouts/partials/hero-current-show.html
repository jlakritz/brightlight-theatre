<section class="hero-split">
  <div class="hero-split__text">
   <div class="hero-split__text-inner">
    <p class="eyebrow">{{ default "Our Next Show" .Params.eyebrow }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.author }}<p class="hero-split__author">{{ . }}</p>{{ end }}
    <div class="hero-split__meta">
      {{ with .Params.hero_details }}<p>{{ . }}</p>{{ end }}
    </div>
    <div class="hero-split__actions">
      <a class="btn btn--solid" href="{{ .Params.booking_url }}" target="_blank" rel="noopener" data-umami-event="Book Tickets" data-umami-event-production="{{ .Title }}"  data-umami-event-location="{{ $.RelPermalink }}">Book Tickets</a>
      <a class="btn btn--ghost" href="{{ .RelPermalink }}" data-umami-event="Show Details Click" data-umami-event-production="{{ .Title  }}"  data-umami-event-location="{{ $.RelPermalink }}">Show Details</a>
    </div>
   </div>
  </div>

  <a class="hero-split__media" href="{{ .RelPermalink }}" aria-label="Read more about {{ .Title }}" data-umami-event="Hero Image Click" data-umami-event-production="{{ .Title  }}"  data-umami-event-location="{{ $.RelPermalink }}">
    <div class="hero-split__bg" style="background-image:url('{{ .Params.cover_image | absURL }}')"></div>
    <div class="hero-split__veil"></div>
    {{ with .Params.show_logo }}
      <img class="hero-split__logo" src="{{ . | absURL }}" alt="{{ $.Title }} logo">
    {{ else }}
      <div class="hero-split__fallback">{{ $.Title }}</div>
    {{ end }}
  </a>
</section>
