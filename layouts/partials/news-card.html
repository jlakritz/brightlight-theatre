{{ $p := . }}
<a class="card card--news" href="{{ $p.RelPermalink }}">
  <div class="card__image card__image--news" style="background-image:url('{{ with $p.Params.image | relURL }}{{ . }}{{ else }}{{ $p.Params.cover_image | relURL}}{{ end }}')">


    <span class="badge">Featured Article</span>

</div>
  <div class="card__body">
    <h3 class="card__title">{{ $p.Title }}</h3>
   {{ with $p.Date }}<p class="page__date">{{ .Format "2 January 2006" }}</p>{{ end }}    
{{ with $p.Summary }}<p class="card__meta">{{ . | plainify | truncate 120 }}</p>{{ end }}
  </div>
</a>
