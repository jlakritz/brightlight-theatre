media:
  input: static/uploads
  output: uploads

content:
  - name: productions
    label: Productions
    type: collection
    path: content/productions
    filename: "{slug}.md"
    view:
      fields:
        - title
        - status
        - date
    fields:
      - name: title
        label: Show Title
        type: string
        required: true
      - name: description
        label: SEO Meta Description (Max 160 chars)
        type: string
        required: false
      - name: status
        label: Status
        type: select
        options:
          values:
            - name: current
              label: Current
            - name: upcoming
              label: Upcoming
            - name: archive
              label: Archive
      - name: onsale
        label: Tickets On Sale
        type: boolean
      - name: date
        label: Publish Date
        type: date
        description: Used to order productions on homepage
      - name: author
        label: Author
        type: string
      - name: hero_details
        label: Hero Details
        type: string
        description: Shown on homepage under the author.
      - name: details
        label: Performance Details
        type: string
        description: Shown on the production page, e.g. 18th and 25th April at St. Peter's Church Hall, Frimley
      - name: eyebrow
        label: Eyebrow
        type: string
        description: Shown above the show title.
      - name: running_time
        label: Running Time
        type: string
        default: TBC
      - name: licence
        label: Performance Licence
        type: string
        description: Legal licence disclaimers etc
      - name: performances
        label: Performance Dates & Times
        type: object
        list: true
        fields:
          - name: date
            label: Date
            type: date
          - name: time
            label: Time (24hr, e.g. 19:30)
            type: string
      - name: price
        label: Ticket Price (display text)
        type: string
        default: £11 adult (£9 concessions)
      - name: price_adult
        label: Adult Price (numeric, e.g. 10.00)
        default: 10.00
        type: number
      - name: price_concession
        label: Concession Price (numeric, e.g. 8.00)
        default: 8.00
        type: number
      - name: currency
        label: Currency Code
        type: string
        default: GBP
        hidden: true
      - name: venue
        label: Venue (display text)
        type: string
        default: St. Peter's Church Hall, Frimley, GU16 7AQ
      - name: venue_address
        label: Venue Address (structured)
        type: object
        fields:
          - name: street
            label: Street / Building Name
            type: string
            default: St. Peter's Church Hall
          - name: locality
            label: Town / City
            type: string
            default: Frimley
          - name: region
            label: County
            type: string
            default: Surrey
          - name: postcode
            label: Postcode
            type: string
            default: GU16 7AQ
      - name: booking_url
        label: Booking URL
        type: string
        description: Full TryBooking URL e.g. https://www.trybooking.com/uk/events/landing/111739- do not include tracking query parameters
      - name: booking_text
        label: Booking Text
        type: string
        description: Shown on booking page under the booking link
      - name: show_logo
        label: Show Logo
        type: image
      - name: cover_image
        label: Cover Image
        type: image
      - name: charity
        label: Charity
        type: object
        fields:
          - name: name
            label: Charity Name
            type: string
            default: KatCanDo
          - name: url
            label: Charity URL
            type: string
            default: https://www.katcando.org.uk/
      - name: gallery
        label: Photo Gallery
        type: image
        list: true
      - name: cast
        label: Cast
        type: string
        list: true
      - name: crew
        label: Crew
        type: string
        list: true
      - name: body
        label: Content
        type: rich-text

  - name: news
    label: News
    type: collection
    path: content/news
    filename: "{slug}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: SEO Meta Description (Max 160 chars)
        type: string
        required: false

      - name: date
        label: Publish Date
        type: date

      - name: image
        label: Header Image
        type: image

      - name: image_alt
        label: Header image alt text
        type: string

      - name: body
        label: Content
        type: rich-text

  - name: about
    label: About Us
    type: file
    path: content/about.md
    fields:
      - name: title
        type: string

      - name: description
        type: string

      - name: eyebrow
        type: string

      - name: cover_image
        label: Cover Image
        type: image

      - name: image_alt
        label: Cover image alt text
        type: string

      - name: body
        type: rich-text

  - name: join_us
    label: Join Us
    type: file
    path: content/join-us.md
    fields:
      - name: title
        type: string

      - name: description
        type: string

      - name: eyebrow
        type: string

      - name: cover_image
        label: Cover Image
        type: image

      - name: image_alt
        label: Cover image alt text
        type: string

      - name: body
        type: rich-text

  - name: contact
    label: Contact
    type: file
    path: content/contact.md
    fields:
      - name: title
        type: string

      - name: description
        type: string

      - name: eyebrow
        type: string

      - name: cover_image
        label: Cover Image
        type: image

      - name: image_alt
        label: Cover image alt text
        type: string

      - name: body
        type: rich-text

  - name: refund-policy
    label: Refund Policy
    type: file
    path: content/refund.md
    fields:
      - name: body
        type: rich-text

  - name: brand-statement
    label: Brand Statement
    type: file
    path: content/brand-statement.md
    fields:
      - name: body
        type: rich-text

  - name: pull-quote
    label: Pull Quote
    type: file
    path: content/pull-quote.md
    fields:
      - name: attribution
        type: rich-text
      - name: role
        type: rich-text
      - name: body
        type: rich-text

  - name: footer
    label: Footer
    type: file
    path: content/footer.md
    fields:
      - name: body
        type: rich-text


  - name: seo-statement
    label: SEO Statement
    type: file
    path: content/seo-statement.md
    fields:
      - name: body
        type: rich-text

  - name: programmes
    label: Digital Programmes
    type: collection
    path: content/programmes
    filename: "{slug}.md"
    view:
      fields:
        - title
        - performance_dates
    fields:
      - name: title
        label: Show Title
        type: string
        required: true
      - name: sitemap
        label: Sitemap Settings
        type: object
        fields:
          - name: disable
            label: Disable on Sitemap?
            type: boolean
      - name: production_url
        label: Production Page URL
        type: string

      - name: tagline
        label: Tagline
        type: string

      - name: cover_image
        label: Cover / Hero Image
        type: image

      - name: show_logo
        label: Show Logo
        type: image
      - name: performance_dates
        label: Performance Dates (display string)
        type: string

      - name: venue
        label: Venue
        type: string

      - name: directors_note
        label: Director's Note
        type: object
        fields:
          - name: text
            label: Note Text
            type: rich-text
          - name: directors
            label: Director Name(s)
            type: string
            list: true
          - name: pull_quote
            label: Note Pull Quote
            type: string

      - name: synopsis
        label: Synopsis
        type: rich-text

      - name: story_pull_quote
        label: Story Pull Quote
        type: object
        fields:
          - name: text
            label: Quote Text
            type: string
          - name: attribution
            label: Attribution
            type: string

      - name: playwright
        label: Playwright
        type: object
        fields:
          - name: name
            label: Name
            type: string
          - name: bio
            label: Bio
            type: string
          - name: image
            label: Photo
            type: image

      - name: cast
        label: Cast
        type: object
        list: true
        fields:
          - name: role
            label: Character / Role
            type: string
          - name: name
            label: Actor Name
            type: string
          - name: image
            label: Photo
            type: image
          - name: bio
            label: Bio
            type: text
          - name: credits
            label: Previous Credits (optional)
            type: string

      - name: cast_pull_quote
        label: Cast Pull Quote
        type: object
        fields:
          - name: text
            label: Quote Text
            type: string
          - name: attribution
            label: Attribution
            type: string          

      - name: crew
        label: Creative Team
        type: object
        list: true
        fields:
          - name: role
            label: Role / Department
            type: string
          - name: name
            label: Name(s)
            type: string

      - name: rehearsal_gallery
        label: Rehearsal Gallery
        type: object
        list: true
        fields:
          - name: type
            label: Media Type
            type: select
            options:
              values:
                - name: photo
                  label: Photo
                - name: video
                  label: Video
          - name: image
            label: Image File (Photos only)
            type: image
          - name: embed_url
            label: Video Embed Link (Videos only)
            type: string
          - name: caption
            label: Caption
            type: string


      - name: rehearsal_pull_quote
        label: Rehearsal Pull Quote
        type: object
        fields:
          - name: text
            label: Quote Text
            type: string
          - name: attribution
            label: Attribution
            type: string

      - name: interviews
        label: Interviews
        type: object
        list: true
        fields:
          - name: person
            label: Person's Name
            type: string
          - name: subject
            label: Their Role
            type: string
          - name: image
            label: Portrait Photo
            type: image
          - name: q_and_a
            label: Q&A
            type: object
            list: true
            fields:
              - name: q
                label: Question
                type: string
              - name: a
                label: Answer
                type: string
          - name: pull_quote
            label: Interview Pull Quote
            type: string

      - name: pull_quotes
        label: Critic & Festival Reviews
        type: object
        list: true
        fields:
          - name: text
            label: Review Quote
            type: string
          - name: name
            label: Name / Publication
            type: string
          - name: role
            label: Title / Award Body
            type: string

      - name: charity
        label: Charity Partner
        type: object
        fields:
          - name: name
            label: Charity Name
            type: string
          - name: url
            label: Charity URL
            type: string
          - name: image
            label: Charity Logo
            type: image
          - name: description
            label: Description
            type: rich-text

      - name: next_show
        label: Next Show Promo
        type: object
        fields:
          - name: title
            label: Show Title
            type: string
          - name: author
            label: Playwright/Author
            type: string
          - name: description
            label: Short Description
            type: rich-text
          - name: dates
            label: Performance Dates
            type: string
          - name: venue
            label: Venue
            type: string
          - name: price
            label: Price Info
            type: string
          - name: cover_image
            label: Poster/Cover Image
            type: image
          - name: booking_url
            label: Ticket Shop URL
            type: string
          - name: booking_text
            label: Booking Button Text
            type: string
          - name: production_url
            label: Show Page URL
            type: string