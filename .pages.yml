media:
  input: static/uploads
  output: uploads

content:
  - name: productions
    label: Productions
    type: collection
    path: content/productions
    filename: "{slug}.md"
    view:
      fields:
        - title
        - status
        - date
    fields:
      - name: title
        label: Show Title
        type: string
        required: true
      - name: description
        label: SEO Meta Description (Max 160 chars)
        type: string
        required: false
      - name: status
        label: Status
        type: select
        options:
          values:
            - name: current
              label: Current
            - name: upcoming
              label: Upcoming
            - name: archive
              label: Archive
      - name: onsale
        label: Tickets On Sale
        type: boolean
      - name: date
        label: Publish Date
        type: date
      - name: author
        label: Author
        type: string
      - name: hero_details
        label: Hero Details
        type: string
      - name: details
        label: Performance Details
        type: string
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: price
        label: Ticket Price (display text)
        type: string
        default: £10 adult (£8 concessions)
      - name: price_adult
        label: Adult Price (numeric, e.g. 10.00)
        default: 10.00
        type: number
      - name: price_concession
        label: Concession Price (numeric, e.g. 8.00)
        default: 8.00
        type: number
      - name: currency
        label: Currency Code
        type: string
        default: GBP
      - name: venue
        label: Venue (display text)
        type: string
        default: St. Peter's Church Hall, Frimley, GU16 7AQ
      - name: venue_address
        label: Venue Address (structured)
        type: object
        fields:
          - name: street
            label: Street / Building Name
            type: string
            default: St. Peter's Church Hall
          - name: locality
            label: Town / City
            type: string
            default: Frimley
          - name: region
            label: County
            type: string
            default: Surrey
          - name: postcode
            label: Postcode
            type: string
            default: GU16 7AQ
      - name: booking_url
        label: Booking URL
        type: string
      - name: booking_text
        label: Booking Text
        type: string
      - name: show_logo
        label: Show Logo
        type: image
      - name: cover_image
        label: Cover Image
        type: image
      - name: running_time
        label: Running Time
        type: string
        default: TBC
      - name: performances
        label: Performance Dates & Times
        type: object
        list: true
        fields:
          - name: date
            label: Date
            type: date
          - name: time
            label: Time (24hr, e.g. 19:30)
            type: string
      - name: charity
        label: Charity
        type: object
        fields:
          - name: name
            label: Charity Name
            type: string
            default: KatCanDo
          - name: url
            label: Charity URL
            type: string
            default: https://www.katcando.org.uk/
      - name: licence
        label: Performance Licence
        type: string
      - name: gallery
        label: Photo Gallery
        type: image
        list: true
      - name: body
        label: Content
        type: rich-text

  - name: news
    label: News
    type: collection
    path: content/news
    filename: "{slug}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: SEO Meta Description (Max 160 chars)
        type: string
        required: false

      - name: date
        label: Publish Date
        type: date

      - name: image
        label: Header Image
        type: image

      - name: image_alt
        label: Header image alt text
        type: string

      - name: body
        label: Content
        type: rich-text

  - name: about
    label: About Us
    type: file
    path: content/about.md
    fields:
      - name: title
        type: string

      - name: description
        type: string

      - name: eyebrow
        type: string

      - name: cover_image
        label: Cover Image
        type: image

      - name: image_alt
        label: Cover image alt text
        type: string

      - name: body
        type: rich-text

  - name: join_us
    label: Join Us
    type: file
    path: content/join-us.md
    fields:
      - name: title
        type: string

      - name: description
        type: string

      - name: eyebrow
        type: string

      - name: cover_image
        label: Cover Image
        type: image

      - name: image_alt
        label: Cover image alt text
        type: string

      - name: body
        type: rich-text

  - name: contact
    label: Contact
    type: file
    path: content/contact.md
    fields:
      - name: title
        type: string

      - name: description
        type: string

      - name: eyebrow
        type: string

      - name: cover_image
        label: Cover Image
        type: image

      - name: image_alt
        label: Cover image alt text
        type: string

      - name: body
        type: rich-text

  - name: refund-policy
    label: Refund Policy
    type: file
    path: content/refund.md
    fields:
      - name: body
        type: rich-text

  - name: brand-statement
    label: Brand Statement
    type: file
    path: content/brand-statement.md
    fields:
      - name: body
        type: rich-text

  - name: pull-quote
    label: Pull Quote
    type: file
    path: content/pull-quote.md
    fields:
      - name: attribution
        type: rich-text
      - name: role
        type: rich-text
      - name: body
        type: rich-text

  - name: footer
    label: Footer
    type: file
    path: content/footer.md
    fields:
      - name: body
        type: rich-text


  - name: seo-statement
    label: SEO Statement
    type: file
    path: content/seo-statement.md
    fields:
      - name: body
        type: rich-text
